# core 镜像全局默认工具链（mise 管理）。
# 用户可在 compose 中用环境变量 MISE_<TOOL>_VERSION 覆盖任意一项，
# 或挂载自己的 mise.toml / .tool-versions（见 README "开发工具镜像" 一节）。
[tools]
go = "1.25.12"
node = "22.19.0"
"npm:pnpm" = "10.32.1"
"npm:bun" = "1.3.14"
python = "3.12"

# 关闭 python 的 GitHub artifact attestations 验证：
# 在 GitHub Actions 上构建时会因未认证 API 调用触发 rate limit（403）而失败。
[settings]
python.github_attestations = false
