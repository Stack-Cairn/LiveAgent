# LiveAgent Headless Core — Docker Compose（独立配置，可直接使用）
# ===============================================================
# 核心开发沙箱（~0.9 GB）。
# 预装: git + 编译链 + go 1.25.12 + node 22.19.0 + python 3.12 + pnpm + bun
# 镜像由 GitHub Actions 构建推送，此处直接拉取，无需本地构建。
#
# 用法（在 LiveAgent 项目根目录）:
#   docker compose -f docker/docker-compose.headless-core.yml up -d
#   docker compose -f docker/docker-compose.headless-core.yml logs -f
#   docker compose -f docker/docker-compose.headless-core.yml down
#
# 环境变量（可选，不设置时用默认值）:
#   GHCR_OWNER=thirsty5034  镜像仓库所有者（fork 后改为自己的用户名）
#   TAG=main                镜像版本（main 分支 push 自动构建为 main；打 v* tag 后可填 v1.2.3 / latest）
#
# 切换运行时版本: 取消注释下方 environment 并改版本号，缺失版本首次启动自动补装。
#   MISE_NODE_VERSION: 20.18.0
#   MISE_PYTHON_VERSION: 3.11
#   MISE_GO_VERSION: 1.24

services:
  headless-core:
    image: ghcr.io/${GHCR_OWNER:-thirsty5034}/liveagent-core:${TAG:-main}
    container_name: liveagent-core
    network_mode: host          # 直接使用宿主机网络，无 NAT 转发
    environment:
      TZ: Asia/Shanghai
      LIVEAGENT_HEADLESS_HOST: 0.0.0.0
      LIVEAGENT_HEADLESS_PORT: 17890
      LIVEAGENT_DATA_DIR: /var/lib/liveagent
      LANG: en_US.UTF-8
    volumes:
      - /vol1/1000/projects:/workspace    # 项目代码统一挂载
      - ./data:/var/lib/liveagent          # 数据持久化（相对运行 compose 的目录）
    restart: unless-stopped