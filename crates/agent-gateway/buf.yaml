# buf 模块配置（v2 schema）。模块根设在 crates/agent-gateway/，供 v2 帧壳导入共享业务消息。
version: v2
modules:
  - path: .
    excludes:
      # 排除 WebUI node_modules 里的第三方 .proto。
      - web
lint:
  use:
    - STANDARD
  except:
    # 历史布局 proto/<版本>/ 早于 buf；迁目录会改 import 路径、破坏 Rust build.rs 与生成物，不翻新。
    - PACKAGE_DIRECTORY_MATCH
  # gateway.proto 中已发布的枚举命名保持不变，仅保留必要的 lint 豁免。
  ignore_only:
    ENUM_VALUE_PREFIX:
      - proto/v2/gateway.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/v2/gateway.proto
breaking:
  use:
    # 同时保护 Protobuf 二进制线格式与 proto JSON 表示的兼容性。
    - WIRE_JSON
