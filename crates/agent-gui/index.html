<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme = "system";
        try {
          const saved = JSON.parse(localStorage.getItem("liveagent.ui-settings.v1") || "null");
          if (saved?.theme === "light" || saved?.theme === "dark" || saved?.theme === "system") {
            theme = saved.theme;
          }
        } catch {}
        const dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.setProperty(
          "--liveagent-boot-background",
          dark ? "#12141c" : "#ffffff",
        );
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --liveagent-boot-background: #ffffff;
        --liveagent-boot-sidebar: #f8f8f9;
        --liveagent-boot-border: rgba(24, 24, 27, 0.1);
        --liveagent-boot-muted: rgba(24, 24, 27, 0.11);
        --liveagent-boot-faint: rgba(24, 24, 27, 0.065);
        --liveagent-boot-thread: rgba(24, 24, 27, 0.2);
      }
      html.dark {
        color-scheme: dark;
        --liveagent-boot-background: #12141c;
        --liveagent-boot-sidebar: #10121a;
        --liveagent-boot-border: rgba(255, 255, 255, 0.09);
        --liveagent-boot-muted: rgba(255, 255, 255, 0.12);
        --liveagent-boot-faint: rgba(255, 255, 255, 0.07);
        --liveagent-boot-thread: rgba(255, 255, 255, 0.22);
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--liveagent-boot-background, #ffffff);
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-shell {
        display: flex;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--liveagent-boot-background);
      }
      .boot-sidebar {
        box-sizing: border-box;
        width: 272px;
        flex: 0 0 272px;
        padding: 16px 12px;
        border-right: 1px solid var(--liveagent-boot-border);
        background: var(--liveagent-boot-sidebar);
      }
      .boot-brand,
      .boot-header-actions,
      .boot-terminal-line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .boot-brand {
        margin: 0 8px 24px;
      }
      .boot-logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--liveagent-boot-muted);
      }
      .boot-line,
      .boot-nav-item,
      .boot-bubble,
      .boot-header-button {
        background: var(--liveagent-boot-muted);
      }
      .boot-line {
        height: 7px;
        border-radius: 999px;
      }
      .boot-nav {
        display: grid;
        gap: 12px;
        padding: 0 8px;
      }
      .boot-nav-item {
        height: 32px;
        border-radius: 8px;
        opacity: 0.55;
      }
      .boot-main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      .boot-header {
        box-sizing: border-box;
        display: flex;
        height: 48px;
        flex: 0 0 48px;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--liveagent-boot-border);
      }
      .boot-header-button {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        opacity: 0.6;
      }
      .boot-canvas,
      .boot-split,
      .boot-split-part,
      .boot-pane {
        min-width: 0;
        min-height: 0;
      }
      .boot-canvas {
        flex: 1;
        overflow: hidden;
      }
      .boot-split {
        display: flex;
        width: 100%;
        height: 100%;
      }
      .boot-split[data-axis="vertical"] {
        flex-direction: column;
      }
      .boot-split-part {
        overflow: hidden;
      }
      .boot-divider {
        box-sizing: border-box;
        flex: 0 0 6px;
        border-right: 1px solid var(--liveagent-boot-border);
        border-left: 1px solid var(--liveagent-boot-border);
      }
      .boot-split[data-axis="vertical"] > .boot-divider {
        border-top: 1px solid var(--liveagent-boot-border);
        border-right: 0;
        border-bottom: 1px solid var(--liveagent-boot-border);
        border-left: 0;
      }
      .boot-pane {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--liveagent-boot-background);
      }
      .boot-pane-header {
        box-sizing: border-box;
        display: flex;
        height: 40px;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--liveagent-boot-border);
      }
      .boot-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--liveagent-boot-muted);
      }
      .boot-pane-body {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 28px 8%;
      }
      .boot-bubble {
        width: 36%;
        height: 40px;
        margin-left: auto;
        border-radius: 16px 16px 4px;
        opacity: 0.55;
      }
      .boot-terminal-body {
        display: grid;
        gap: 12px;
        padding: 20px 16px;
      }
      .boot-terminal-prompt {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: rgba(16, 185, 129, 0.4);
      }
      .boot-pane::after {
        position: absolute;
        inset-inline: 8%;
        top: 0;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, var(--liveagent-boot-thread), transparent);
        animation: boot-thread 1.8s ease-in-out infinite;
      }
      @keyframes boot-thread {
        0% {
          opacity: 0;
          transform: translateY(42px);
        }
        20%,
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(min(48vh, 420px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pane::after {
          animation: none;
          opacity: 0.35;
          transform: translateY(42px);
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LiveAgent</title>
  </head>

  <body>
    <div id="root">
      <div class="boot-shell" data-static-boot-shell="" role="status" aria-label="正在加载 LiveAgent">
        <aside class="boot-sidebar" aria-hidden="true">
          <div class="boot-brand">
            <div class="boot-logo"></div>
            <div class="boot-line" style="width: 80px"></div>
          </div>
          <div class="boot-nav">
            <div class="boot-line" style="width: 64px"></div>
            <div class="boot-nav-item"></div>
            <div class="boot-nav-item"></div>
            <div class="boot-nav-item"></div>
          </div>
        </aside>
        <main class="boot-main">
          <header class="boot-header" aria-hidden="true">
            <div class="boot-line" style="width: 96px"></div>
            <div class="boot-header-actions">
              <div class="boot-header-button"></div>
              <div class="boot-header-button"></div>
            </div>
          </header>
          <div class="boot-canvas" data-static-boot-canvas="">
            <div class="boot-pane" data-boot-pane="conversation">
              <div class="boot-pane-header" aria-hidden="true">
                <div class="boot-dot"></div>
                <div class="boot-line" style="width: 80px"></div>
              </div>
              <div class="boot-pane-body" aria-hidden="true">
                <div class="boot-line" style="width: 58%"></div>
                <div class="boot-line" style="width: 42%; opacity: 0.65"></div>
                <div class="boot-bubble"></div>
                <div class="boot-line" style="width: 72%"></div>
                <div class="boot-line" style="width: 54%; opacity: 0.65"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      (() => {
        const canvas = document.querySelector("[data-static-boot-canvas]");
        const paneMarkup = (variant) => {
          const pane = document.createElement("div");
          pane.className = "boot-pane";
          pane.dataset.bootPane = variant;
          pane.innerHTML =
            variant === "terminal"
              ? '<div class="boot-pane-header" aria-hidden="true"><div class="boot-dot"></div><div class="boot-line" style="width:80px"></div></div><div class="boot-terminal-body" aria-hidden="true"><div class="boot-terminal-line"><span class="boot-terminal-prompt"></span><span class="boot-line" style="width:160px"></span></div><div class="boot-line" style="width:224px;opacity:.65"></div><div class="boot-line" style="width:144px;opacity:.65"></div></div>'
              : '<div class="boot-pane-header" aria-hidden="true"><div class="boot-dot"></div><div class="boot-line" style="width:80px"></div></div><div class="boot-pane-body" aria-hidden="true"><div class="boot-line" style="width:58%"></div><div class="boot-line" style="width:42%;opacity:.65"></div><div class="boot-bubble"></div><div class="boot-line" style="width:72%"></div><div class="boot-line" style="width:54%;opacity:.65"></div></div>';
          return pane;
        };
        const buildTree = (node, panes, depth = 0) => {
          if (!node || depth > 8) return null;
          if (node.type === "leaf" && typeof node.paneId === "string") {
            const surface = panes[node.paneId]?.surface;
            const terminal = surface?.kind === "localTerminal" || surface?.kind === "sshTerminal";
            return paneMarkup(terminal ? "terminal" : "conversation");
          }
          if (node.type !== "split" || !["horizontal", "vertical"].includes(node.axis)) return null;
          const first = buildTree(node.first, panes, depth + 1);
          const second = buildTree(node.second, panes, depth + 1);
          if (!first || !second) return null;
          const ratio = Number.isFinite(node.ratio) ? Math.min(0.9, Math.max(0.1, node.ratio)) : 0.5;
          const split = document.createElement("div");
          split.className = "boot-split";
          split.dataset.axis = node.axis;
          const firstPart = document.createElement("div");
          firstPart.className = "boot-split-part";
          firstPart.style.flex = `0 0 calc(${ratio * 100}% - 3px)`;
          firstPart.append(first);
          const divider = document.createElement("div");
          divider.className = "boot-divider";
          const secondPart = document.createElement("div");
          secondPart.className = "boot-split-part";
          secondPart.style.flex = "1";
          secondPart.append(second);
          split.append(firstPart, divider, secondPart);
          return split;
        };
        try {
          const raw = localStorage.getItem("liveagent.sessionWorkbench.layout.v1");
          const layout = raw ? JSON.parse(raw) : null;
          const panes = layout?.panes && typeof layout.panes === "object" ? layout.panes : null;
          if (canvas && panes && Object.keys(panes).length >= 2 && Object.keys(panes).length <= 16) {
            const tree = buildTree(layout.root, panes);
            if (tree) canvas.replaceChildren(tree);
          }
        } catch {}
        performance.mark?.("liveagent:static-shell-ready");
        const reveal = (attempt = 0) => {
          const invoke = window.__TAURI_INTERNALS__?.invoke;
          if (typeof invoke !== "function") {
            if (attempt < 80) window.setTimeout(() => reveal(attempt + 1), 25);
            return;
          }
          invoke("app_frontend_ready").catch(() => {
            if (attempt < 80) window.setTimeout(() => reveal(attempt + 1), 25);
          });
        };
        void document.documentElement.offsetHeight;
        reveal();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
