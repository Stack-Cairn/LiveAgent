<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme = "system";
        try {
          const saved = JSON.parse(localStorage.getItem("liveagent.ui-settings.v1") || "null");
          if (saved?.theme === "light" || saved?.theme === "dark" || saved?.theme === "system") {
            theme = saved.theme;
          }
        } catch {}
        const dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.setProperty(
          "--liveagent-boot-background",
          dark ? "#12141c" : "#ffffff",
        );
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --liveagent-boot-background: #ffffff;
        --liveagent-boot-track: rgba(24, 24, 27, 0.09);
        --liveagent-boot-bar: rgba(15, 78, 113, 0.68);
      }
      html.dark {
        color-scheme: dark;
        --liveagent-boot-background: #12141c;
        --liveagent-boot-track: rgba(255, 255, 255, 0.1);
        --liveagent-boot-bar: rgba(142, 211, 235, 0.72);
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--liveagent-boot-background, #ffffff);
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot-screen {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--liveagent-boot-background);
      }
      .app-boot-content {
        display: flex;
        width: 160px;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .app-boot-icon {
        display: block;
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 10px 22px rgba(7, 45, 78, 0.14));
      }
      .app-boot-progress {
        width: 128px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--liveagent-boot-track);
      }
      .app-boot-progress > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--liveagent-boot-bar);
        animation: app-boot-progress 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-progress > span {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LiveAgent</title>
  </head>

  <body>
    <div id="root">
      <div class="app-boot-screen" data-static-boot-shell="" role="status" aria-label="正在加载 LiveAgent" aria-busy="true">
        <div class="app-boot-content" aria-hidden="true">
          <img class="app-boot-icon" src="/src-tauri/icons/icon-simple.png" alt="" />
          <div class="app-boot-progress"><span></span></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        performance.mark?.("liveagent:static-shell-ready");
        const reveal = (attempt = 0) => {
          const invoke = window.__TAURI_INTERNALS__?.invoke;
          if (typeof invoke !== "function") {
            if (attempt < 80) window.setTimeout(() => reveal(attempt + 1), 25);
            return;
          }
          invoke("app_frontend_ready").catch(() => {
            if (attempt < 80) window.setTimeout(() => reveal(attempt + 1), 25);
          });
        };
        void document.documentElement.offsetHeight;
        let revealed = false;
        const revealOnce = () => {
          if (revealed) return;
          revealed = true;
          performance.mark?.("liveagent:first-paint-ready");
          reveal();
        };
        const revealFallback = window.setTimeout(revealOnce, 250);
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            window.clearTimeout(revealFallback);
            revealOnce();
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
