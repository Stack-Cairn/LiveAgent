<!doctype html><meta charset="utf-8"><title>LiveAgent style comparison</title>
<style>body{font:14px system-ui;margin:20px}label{margin-right:12px}button{margin:8px}#frames{display:flex;gap:16px;overflow:auto}iframe{height:800px;flex:none;border:1px solid #bbb}pre{white-space:pre-wrap}</style>
<h1>LiveAgent component styles</h1><p>Real React components. Compare snapshots at fixed animation times. Reduced motion simulates CSS media conditions; it does not change the operating system preference.</p>
<label>Host <select id="host"><option>gui</option><option>web</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><label>Width <select id="width"><option>1280</option><option>380</option></select></label><label><input id="disabled" type="checkbox">Disabled</label><label><input id="reduced" type="checkbox">Reduced motion</label><button id="show">Show</button><button id="compare">Compare current</button><button id="matrix">Run matrix</button><pre id="result">Ready</pre><div id="frames"></div>
<script>
const hasBaseline=__BASELINE__,frames=document.getElementById('frames'),result=document.getElementById('result');
async function load(settings){frames.replaceChildren();const docs=[];for(const side of hasBaseline?['before','after']:['after']){const frame=document.createElement('iframe');frame.width=settings.width;frames.append(frame);const loaded=new Promise(resolve=>frame.onload=resolve);frame.src='/'+side+'/frame.html?'+new URLSearchParams(settings);await loaded;const deadline=Date.now()+15000;while(frame.contentDocument.documentElement.dataset.ready!=='true'){if(Date.now()>deadline)throw Error('Component mount timed out');await new Promise(r=>setTimeout(r,30));}await frame.contentDocument.fonts.ready;docs.push(frame.contentDocument);}return docs;}
function settings(){return {host:document.getElementById('host').value,theme:document.getElementById('theme').value,width:document.getElementById('width').value,disabled:document.getElementById('disabled').checked,reduced:document.getElementById('reduced').checked};}
function capture(doc,time,focus){if(!focus&&doc.activeElement instanceof doc.defaultView.HTMLElement)doc.activeElement.blur();if(focus)doc.querySelector('input')?.focus();for(const a of doc.getAnimations()){a.pause();a.currentTime=time;}const data=[];for(const scene of doc.querySelectorAll('[data-case]')){const nodes=[...scene.querySelector('[data-sample]').querySelectorAll('*')];for(let i=0;i<nodes.length;i++)for(const pseudo of [null,'::before','::after']){const style=doc.defaultView.getComputedStyle(nodes[i],pseudo),values={};for(const p of style){if(p.startsWith('--'))continue;values[p]=style.getPropertyValue(p);}data.push({case:scene.dataset.case,i,pseudo,tag:nodes[i].tagName,values});}}return data;}
async function compare(settings){if(!hasBaseline)throw Error('Use --baseline <snapshot-directory> to compare.');const docs=await load(settings),diffs=[];for(const time of [0,500])for(const focus of [false,true]){const [before,after]=docs.map(doc=>capture(doc,time,focus));if(before.length!==after.length){diffs.push({structure:[before.length,after.length]});continue;}for(let i=0;i<before.length;i++){const a=before[i],b=after[i];if(a.case!==b.case||a.tag!==b.tag){diffs.push({structure:[a.case,a.tag,b.case,b.tag]});continue;}for(const p of Object.keys(a.values))if(a.values[p]!==b.values[p])diffs.push({case:a.case,i:a.i,pseudo:a.pseudo,time,focus,p,before:a.values[p],after:b.values[p]});}}return {settings,diffs};}
document.getElementById('show').onclick=()=>load(settings()).then(()=>result.textContent=hasBaseline?'Baseline / Current':'Current snapshot').catch(e=>result.textContent=String(e));
document.getElementById('compare').onclick=async()=>{try{result.textContent=JSON.stringify(await compare(settings()),null,2)}catch(e){result.textContent=String(e)}};
document.getElementById('matrix').onclick=async()=>{const results=[];try{for(const host of ['gui','web'])for(const theme of ['light','dark'])for(const width of [1280,380])for(const reduced of [false,true])for(const disabled of [false,true]){results.push(await compare({host,theme,width,reduced,disabled}));result.textContent=JSON.stringify({status:'running',done:results.length});}result.textContent=JSON.stringify({status:'complete',results});}catch(e){result.textContent=JSON.stringify({status:'error',message:String(e)})}};
load(settings());
</script>
