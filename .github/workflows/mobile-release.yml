name: Mobile Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: 22.19.0

jobs:
  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release/prepare-app-version-from-tag.mjs "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT" --json

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      LIVEAGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      LIVEAGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      LIVEAGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare release version config
        working-directory: crates/agent-mobile
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$LIVEAGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;26.3.11579264" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/agent-mobile/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter @liveagent/mobile...

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/liveagent-release.jks"
          test -s "$RUNNER_TEMP/android-signing/liveagent-release.jks"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/android-signing/liveagent-release.jks"
          } > crates/agent-mobile/src-tauri/gen/android/local.properties

      - name: Build Android APK and AAB
        working-directory: crates/agent-mobile
        run: pnpm tauri android build --ci --config "$LIVEAGENT_TAURI_VERSION_CONFIG"

      - name: Stage Android artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_path="$(find crates/agent-mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*/release/*' -print -quit)"
          aab_path="$(find crates/agent-mobile/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -path '*/universalRelease/*' -print -quit)"
          test -n "$apk_path"
          test -n "$aab_path"
          cp "$apk_path" "dist/LiveAgent-${LIVEAGENT_RELEASE_TAG}-Android.apk"
          cp "$aab_path" "dist/LiveAgent-${LIVEAGENT_RELEASE_TAG}-Android.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: liveagent-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - android
    env:
      LIVEAGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      LIVEAGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      LIVEAGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: liveagent-android
          path: release-artifacts

      - name: Publish Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          is_prerelease="$LIVEAGENT_IS_PRERELEASE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # 桌面端 release 可能已创建同名 Release；这里只追加 Android 资产，不动标题与说明。
            echo "Release $RELEASE_TAG already exists; uploading Android assets only."
          else
            create_args=(--verify-tag --title "LiveAgent $RELEASE_TAG" --notes "LiveAgent $RELEASE_TAG")
            if [ "$is_prerelease" = true ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}"
          fi

          shopt -s nullglob
          android_assets=(release-artifacts/*)
          if [ "${#android_assets[@]}" -eq 0 ]; then
            echo "No Android release assets were found."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${android_assets[@]}" --clobber
