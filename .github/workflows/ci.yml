name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

jobs:
  backend:
    name: Backend Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # routes_gen.rs 是脚本生成的：wrapper 变了没重新生成 → 这里失败。
      - name: Check generated routes are in sync
        run: make check-routes

      # 阶段 1 的 command 分类门禁：新增 Tauri command 必须归类。
      - name: Check command classification is complete
        run: make check-command-classes

      # 编译期防线的 CI 版：backend 是跨壳内核，一旦它依赖 tauri，
      # headless 后端就再也编不出来了。依赖链上出现 tauri 直接失败。
      - name: Ensure backend stays Tauri-free
        run: |
          set -euo pipefail
          # 先落到变量：直接 `cargo tree | grep -q` 的话，cargo tree 自己失败会让
          # grep 收到空输入从而"通过"，门禁就成了摆设。
          tree="$(cargo tree -p backend)"
          if printf '%s\n' "$tree" | grep -q tauri; then
            echo "::error::backend 依赖树里出现了 tauri，跨壳内核的防线破了"
            printf '%s\n' "$tree" | grep tauri
            exit 1
          fi
          echo "backend 依赖树干净，无 tauri"

      - name: Test backend and backend
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p backend

      # 只 lint 后端这两个 crate：src-tauri 也在同一 workspace 里，用
      # --workspace 会把 GTK/WebKit 那套系统依赖拖进这个 job。src-tauri
      # 由 tauri-rust job 单独覆盖。
      - name: Clippy backend and backend
        env:
          CARGO_TERM_COLOR: always
        run: cargo clippy -p backend --all-targets -- -D warnings

  backend-docker:
    name: Backend Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: liveagent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker rm -f liveagent-backend-smoke >/dev/null 2>&1 || true
          # 不传 --tls-cert，容器内是明文 HTTP：TLS 由外层（Railway / 反代）终结。
          # 也不传 --password，后端会自己生成一个并打到 stderr —— /healthz 不需要鉴权。
          docker run -d \
            --name liveagent-backend-smoke \
            -p 18443:8443 \
            liveagent-backend:ci
          trap 'docker rm -f liveagent-backend-smoke >/dev/null 2>&1 || true' EXIT
          # /healthz 返回纯文本 ok，且刻意在鉴权之外。Node 引擎就绪探测最多 30s，
          # 这里给 60s 余量。
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18443/healthz | grep -q 'ok'; then
              echo "Backend Docker smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "Backend Docker smoke test failed; container logs:"
          docker logs liveagent-backend-smoke || true
          exit 1

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        working-directory: crates/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build GUI frontend
        working-directory: crates/frontend
        run: pnpm build

      - name: Lint GUI frontend
        working-directory: crates/frontend
        run: pnpm lint

      - name: Test frontend modules
        working-directory: crates/frontend
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/frontend
        run: pnpm test:release

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/frontend/src-tauri

      - name: Check Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        run: cargo check --manifest-path crates/frontend/src-tauri/Cargo.toml --tests

      - name: Test Tauri history migrations
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/frontend/src-tauri/Cargo.toml chat_history --lib

      - name: Test SSH local forwarding
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/frontend/src-tauri/Cargo.toml ssh_local_forward --lib

      - name: Test Tauri shell-runner cancellation
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/frontend/src-tauri/Cargo.toml shell_runner --lib

      - name: Test Tauri MCP integration
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/frontend/src-tauri/Cargo.toml integration_commands::mcp --lib

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
