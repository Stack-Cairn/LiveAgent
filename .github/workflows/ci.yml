name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # buf breaking uses the actual PR base, including v2 integration PRs.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.71.0

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build embedded Gateway WebUI
        run: |
          pnpm install --frozen-lockfile --filter @liveagent/gateway-webui...
          pnpm --filter @liveagent/gateway-webui build

      - name: Proto lint and breaking-change check
        env:
          PROTO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make proto-check BUF_BREAKING_AGAINST="../../.git#ref=${PROTO_BASE_SHA},subdir=crates/agent-gateway"

      - name: Check generated protobuf
        run: |
          make proto
          git diff --exit-code -- crates/agent-gateway/internal/proto crates/agent-gateway/web/src/lib/proto/gen

      - name: Lint gateway
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: crates/agent-gateway

      - name: Test gateway
        working-directory: crates/agent-gateway
        run: go test ./...

  gateway-docker:
    name: Gateway Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: liveagent-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker rm -f liveagent-gateway-smoke >/dev/null 2>&1 || true
          docker run -d \
            --name liveagent-gateway-smoke \
            -p 18080:8080 \
            -e LIVEAGENT_GATEWAY_TOKEN=ci-token \
            liveagent-gateway:ci
          trap 'docker rm -f liveagent-gateway-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          echo "Gateway Docker smoke test failed; container logs:"
          docker logs liveagent-gateway-smoke || true
          exit 1

  webui:
    name: Gateway WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter @liveagent/gateway-webui...

      - name: Build WebUI
        working-directory: crates/agent-gateway/web
        run: pnpm build

      - name: Lint WebUI
        working-directory: crates/agent-gateway/web
        run: pnpm lint

      - name: Test WebUI modules
        working-directory: crates/agent-gateway/web
        run: pnpm test

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        # GUI frontend tests load shared Gateway WebUI modules (including STT adapters).
        # Install that workspace and its transitive dependencies in this isolated job.
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter liveagent... --filter @liveagent/gateway-webui...

      - name: Typecheck and build GUI frontend
        working-directory: crates/agent-gui
        run: pnpm build

      - name: Lint GUI frontend
        working-directory: crates/agent-gui
        run: pnpm lint

      - name: Download checksum-verified K-brain release
        run: node scripts/release/prepare-kbrain.mjs --release

      - name: Test frontend modules
        working-directory: crates/agent-gui
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/agent-gui
        run: |
          pnpm test:release
          node --test ../../scripts/release/*.test.mjs

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/agent-gui/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # build.rs 编译 gateway protos 并从 package.json 读取应用版本。
              - 'crates/agent-gateway/proto/**'
              - 'crates/agent-gui/package.json'
              - '.github/workflows/ci.yml'

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # push 到 main 时始终运行以持续更新共享缓存;PR 仅在 Rust 相关路径变更时运行。
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    env:
      # 行号级 debuginfo:显著降低 codegen 与链接开销,同时保留可读的失败回溯。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare Gateway sidecar required by tauri-build
        run: |
          npm install -g pnpm@10.32.1
          pnpm install --frozen-lockfile --filter liveagent-workspace --filter @liveagent/gateway-webui...
          node scripts/prepare-gateway.mjs --target x86_64-unknown-linux-gnu

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libglib2.0-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          pkg-config --atleast-version=2.70 glib-2.0
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace 根在仓库根目录(Cargo.lock 与 target/ 均在此),
          # 指向子目录会导致依赖产物完全不被缓存。
          workspaces: .

      # tauri-build 要求 externalBin 的 sidecar 存在;--lib 单元测试不会执行它,放置空占位即可。
      - name: Stub K-brain sidecars
        working-directory: crates/agent-gui/src-tauri
        run: |
          mkdir -p binaries
          for bin in k-brain k-brain-computer; do
            install -m 755 /dev/null "binaries/$bin-x86_64-unknown-linux-gnu"
          done

      - name: Build Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib --no-run

      - name: Test Tauri backend
        env:
          CARGO_TERM_COLOR: always
        # libtest 支持多个过滤器(取并集),单次调用可让各组测试并行执行。
        run: >
          cargo test --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib --
          chat_history ssh_local_forward shell_runner integration_commands::mcp
          services::system_proxy services::kbrain_backend
          history_sync_v2_tests history_sync_command_tests

  managed-gateway:
    name: Desktop Gateway (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev
          # Ubuntu 22.04 protoc requires the optional-field flag; use the same
          # modern compiler as desktop releases instead.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          sudo unzip -oq "$RUNNER_TEMP/protoc.zip" -d /usr/local 'bin/protoc' 'include/*'
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"

      - name: Install macOS protobuf compiler
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Linux mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install Windows protobuf compiler
        if: runner.os == 'Windows'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $destination = Join-Path $env:RUNNER_TEMP "protoc-34.0"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-win64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $protoc = Join-Path $destination "bin\protoc.exe"
          & $protoc --version
          if ($LASTEXITCODE -ne 0) { throw "protoc verification failed: $LASTEXITCODE" }
          "PROTOC=$protoc" | Out-File -Append $env:GITHUB_ENV
          (Split-Path $protoc) | Out-File -Append $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: |
          npm install -g pnpm@10.32.1
          pnpm install --frozen-lockfile --filter liveagent-workspace --filter liveagent... --filter @liveagent/gateway-webui...

      - name: Build sidecar with embedded WebUI
        run: node scripts/prepare-gateway.mjs --target ${{ matrix.target }}

      - name: Download checksum-verified K-brain release
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/release/prepare-kbrain.mjs --release

      - name: Run existing Gateway and settings tests
        run: cargo test --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib -- settings::tests services::gateway::tests services::gateway::connection::transport_supervisor_tests history_sync_v2_tests history_sync_command_tests

  ui-boundaries:
    name: Shared UI Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        # Shared UI resolves host adapters from the desktop package while typechecking.
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter liveagent... --filter @liveagent/ui...

      - name: Typecheck shared UI
        run: pnpm typecheck:ui

      - name: Lint shared UI
        run: pnpm lint:ui

      - name: Run check script tests
        run: pnpm check:script-tests

      - name: Check shared UI dependency boundaries and mirrors
        run: node scripts/check-mirror.mjs

      - name: Reject new Biome warnings
        env:
          LIVEAGENT_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/check-biome-changed.mjs ui
          node scripts/check-biome-changed.mjs gui
          node scripts/check-biome-changed.mjs webui

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff-tree --check --no-commit-id --root -r "${HEAD_SHA}"
          fi
