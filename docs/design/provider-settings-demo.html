<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LiveAgent · 供应商配置 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0e1013;--panel:#15181d;--panel2:#1b1f26;--line:#262b33;--line2:#343a44;
  --text:#e6e8eb;--muted:#9aa3ad;--dim:#6b7480;--accent:#7aa2f7;--accent-bg:#1c2740;
  --ok:#3fb950;--ok-bg:#12261a;--warn:#e3b341;--warn-bg:#2b2410;--bad:#f0616a;--bad-bg:#2c1518;
  --purple:#b48ead;--purple-bg:#26202b;--radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#0b0f18;border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:4px 8px}
button.sm{padding:3px 8px;font-size:12px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:var(--radius);padding:7px 10px;width:100%}
input.mono{font-family:var(--mono);font-size:13px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px}
.nav h1{font-size:15px;font-weight:500;margin:4px 8px 16px}
.nav .g{font-size:11px;color:var(--dim);margin:12px 8px 4px}
.nav .i{padding:7px 10px;border-radius:var(--radius);color:var(--muted);font-size:13px}
.nav .i.on{background:var(--panel2);color:var(--text)}
.main{display:grid;grid-template-columns:260px 1fr;min-height:100vh;position:relative}
.list{background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.list .search{display:flex;gap:6px}
.list .filters{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);cursor:default;white-space:nowrap}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.purple{background:var(--purple-bg);color:var(--purple);border-color:transparent}
.chip.click{cursor:pointer}
.chip.strike{text-decoration:line-through;opacity:.6}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent}
.prow:hover{background:var(--panel2)}
.prow.on{background:var(--panel2);border-color:var(--line2)}
.logo{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.prow .n{flex:1;min-width:0}
.prow .n b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .n small{color:var(--dim);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--ok)}
.detail{padding:22px 28px 60px;overflow:auto;max-width:980px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
@media (max-width:1100px){.app{grid-template-columns:1fr}.nav{display:none}}
@media (max-width:900px){.main{grid-template-columns:220px 1fr}.drawer{width:100%}}
.hdr h2{font-size:20px;font-weight:500;margin:0}
.sec{margin:0 0 22px}
.sec>.t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 8px;flex-wrap:wrap}
.sec>.t>*{white-space:nowrap}
.sec>.t .sp{flex:1}
.field{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-family:var(--mono);font-size:13px;min-height:40px}
.field .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.grp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:10px 4px 4px}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow .id{font-family:var(--mono);min-width:180px}
.mrow .ic{color:var(--dim);font-size:12px;display:inline-flex;gap:6px;flex:none;white-space:nowrap}
.mrow .chip{flex:none}
.mrow .sp{flex:1}
.mrow.dis{opacity:.5}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:none;border:0;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:16px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);word-break:break-all}
.drawer{position:absolute;top:0;right:0;bottom:0;width:560px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.35);padding:18px 22px 40px;overflow:auto;display:none;z-index:5}
.drawer.open{display:block}
.drawer h3{font-size:17px;font-weight:500;margin:0 0 14px;display:flex;align-items:center}
.drawer h3 .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px}
.lab{font-size:12px;color:var(--muted);margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.lab .sp{flex:1}
.src{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.src.auto{color:var(--accent);border-color:var(--accent-bg);background:var(--accent-bg)}
.src.user{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.ep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel2)}
.ep.off{opacity:.6}
.ep .h{display:flex;align-items:center;gap:8px;font-weight:500}
.ep .h .sp{flex:1}
.ep .body{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--dim);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.overlay.open{display:flex}
.modal{width:720px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px 24px}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:500}
.steps{display:flex;gap:6px;font-size:12px;color:var(--dim);margin:0 0 14px}
.steps span.on{color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel2)}
.preset:hover,.preset.on{border-color:var(--accent)}
.preset small{display:block;color:var(--dim);font-size:11px}
.probe{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);margin:0 0 6px;font-size:13px}
.probe .sp{flex:1}
.summ{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--panel2)}
.summ .h{display:flex;align-items:center;gap:8px}
.summ .h .sp{flex:1}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.avatar{width:72px;height:72px;border-radius:50%;background:#3f8ea3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:4px auto 10px}
.pathprev{font-family:var(--mono);font-size:12px;color:var(--dim);margin:4px 0 0}
.pathprev b{color:var(--muted);font-weight:500}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:flex;align-items:center}
details.more summary::after{content:"⌄";margin-left:auto}
.req{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.tbl th{font-family:inherit;color:var(--muted);font-weight:500}
.tier{font-family:inherit;color:var(--muted)}
.empty{color:var(--dim);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:999px;font-size:13px;display:none;z-index:20}
.toast.show{display:block}
</style>
</head>

  <div class="hint">上下文预算 = min(最大输入, 上下文窗口 − 输出预留)；目录未命中时用按协议家族的启发式默认值（当前来源：${mo.limitsSource==="catalog"?"内置目录":"启发式"}）。</div>
  <div class="lab" style="margin-top:16px">路由解析结果（纯函数输出，运行时只读这一份）</div>
  ${r&&!r.none?`<div class="card" style="background:var(--panel2)"><div class="kv"><span class="k">接口</span><span class="v">${r.protocol} <span class="src auto">${({model:"模型显式",preset:"预设规则",family:"模型家族",provider:"供应商默认"})[r.source]||r.source}</span></span><span class="k">方言</span><span class="v">${r.dialect}</span><span class="k">Base URL</span><span class="v">${r.baseUrl}</span><span class="k">远端模型 ID</span><span class="v">${r.wireModelId}</span><span class="k">凭据</span><span class="v">${r.credLabel}（${r.credentialId}） <span class="src ${r.credentialSource==="fallback"?'user':'auto'}">${({endpoint:"端点指定",scope:"按范围与顺序",fallback:"范围外兜底",override:"模型指定"})[r.credentialSource]||r.credentialSource}</span></span><span class="k">quirks</span><span class="v">${Object.keys(r.quirks).length?JSON.stringify(r.quirks):"自动"}</span><span class="k">最终请求头</span><span class="v">${Object.entries(r.headers).map(([k,v])=>k+": "+v).join("<br>")}</span></div></div>`:`<div class="empty">无可用渠道：请在请求配置里启用至少一个该模型可走的接口</div>`}
  <div class="lab">故障转移候选</div><table class="tbl"><tr><th>层</th><th>供应商</th><th>接口</th><th>方言</th><th>凭据</th></tr>${candidates(p,mo.id).map(c=>`<tr><td class="tier">${c.tier}</td><td>${c.pname}</td><td>${c.protocol}</td><td>${c.dialect}</td><td>${c.credLabel}</td></tr>`).join("")}</table>`;}
const mo=id=>P().models.find(x=>x.id===id);
function manualThinking(id){const v=prompt("可选档位，逗号分隔（minimal, low, medium, high, xhigh, max）；留空表示非思考模型","low, medium, high");if(v===null)return;mo(id).manualThinking={levels:v.split(",").map(x=>x.trim()).filter(x=>LADDER.includes(x))};mo(id).caps.reasoning=mo(id).manualThinking.levels.length?1:0;renderAll();}
function cycleCap(c){const x=mo(drawerState.id);const v=x.caps[c];x.caps[c]=v===1?0:v===0?undefined:1;renderAll();}
function moveProto(id,i,d){const l=mo(id).chatProtocols;if(i+d<0||i+d>=l.length)return;const t=l[i];l[i]=l[i+d];l[i+d]=t;renderAll();}

// ───────────────── 向导：快速接入 ─────────────────
let wiz=null;
function openWizard(){wiz={step:1,preset:null,origin:"",key:"",results:null,accept:{}};renderWizard();document.getElementById("overlay").classList.add("open");}
function closeWizard(){document.getElementById("overlay").classList.remove("open");wiz=null;}
function renderWizard(){const m=document.getElementById("modal");const steps=["渠道","地址与密钥","探测接口","摘要采纳"];const head=`<h3>添加供应商</h3><div class="steps">${steps.map((s,i)=>`<span class="${wiz.step===i+1?'on':''}">${i+1} ${s}</span>${i<3?"<span>›</span>":""}`).join("")}</div>`;
  if(wiz.step===1){m.innerHTML=head+`<div class="presets">${PRESETS.map(p=>`<div class="preset ${wiz.preset===p.id?'on':''}" onclick="wiz.preset='${p.id}';renderWizard()"><div class="logo">${p.logo}</div><div><b style="font-weight:500">${p.name}</b><small>${p.sub||{official:"官方",relay:"中转",'self-hosted':"自建"}[p.category]} · ${Object.keys(p.endpoints).length||"探测"} 个接口</small></div></div>`).join("")}</div><div class="foot"><button onclick="closeWizard()">取消</button><button class="primary" ${wiz.preset?"":"disabled"} onclick="wiz.step=2;renderWizard()">下一步</button></div>`;return;}
  const pr=PRESETS.find(x=>x.id===wiz.preset);
  if(wiz.step===2){m.innerHTML=head+`<div class="lab">预设</div><div class="field" style="font-family:inherit"><div class="logo">${pr.logo}</div>${pr.name}<span class="chip">${Object.keys(pr.endpoints).map(k=>PNAME[k]).join(" · ")||"探测四类接口"}</span></div>
    ${pr.input==="key"?"":`<div class="lab">${pr.input==="origin"?"服务地址（origin，不含 /v1）":"Base URL"}</div><input class="mono" id="w-origin" placeholder="${pr.input==="origin"?"https://relay.example.com":"https://api.example.com/v1"}" value="${wiz.origin}">`}
    ${pr.auth==="none"?`<div class="hint" style="margin-top:8px">本地服务不需要密钥。</div>`:`<div class="lab">API Key</div><input class="mono" id="w-key" type="password" placeholder="sk-…" value="${wiz.key}">`}
    <div class="hint" style="margin-top:10px">接下来只会请求各接口的模型列表，不产生生成任务，不计费。</div>
    <div class="foot"><button onclick="closeWizard()">取消</button><button class="primary" onclick="wizProbe()">检测并配置</button></div>`;return;}
  if(wiz.step===3){m.innerHTML=head+`<div class="lab">探测 ${wiz.origin||pr.name}</div>${wiz.results.map(r=>`<div class="probe"><span>${PNAME[r.k]}</span><span class="hint">${r.url}</span><span class="sp"></span>${r.status==="pending"?`<span class="chip">检测中…</span>`:probeChip({probe:r})}</div>`).join("")}<div class="foot"><button onclick="wiz.step=2;renderWizard()">上一步</button><button class="primary" ${wiz.results.every(r=>r.status!=="pending")?"":"disabled"} onclick="wizSummary()">查看摘要</button></div>`;return;}
  if(wiz.step===4){const ok=wiz.results.filter(r=>r.status==="ok");const groups={};wiz.models.forEach(id=>{(groups[family(id).key]=groups[family(id).key]||[]).push(id);});
    m.innerHTML=head+`<div class="summ"><div class="h"><b style="font-weight:500">渠道</b><span class="chip">${ok.length} 个可用，默认 ${PNAME[wiz.defaultProto]}</span></div><div class="chips" style="margin-top:6px">${wiz.results.map(r=>`<span class="chip click ${r.status==="ok"&&wiz.accept[r.k]!==false?'on':r.status!=='ok'?'strike':''}" onclick="${r.status==="ok"?`wiz.accept['${r.k}']=wiz.accept['${r.k}']===false;renderWizard()`:""}">${PNAME[r.k]}${r.status!=="ok"?"（"+({missing:"不存在",unauthorized:"鉴权失败",unknown:"未知"})[r.status]+"）":""}</span>`).join("")}</div></div>
    <div class="summ"><div class="h"><b style="font-weight:500">模型</b><span class="chip">${wiz.models.length} 个，按家族分组；默认只勾选能识别家族的分组</span></div>${Object.entries(groups).map(([g,ids])=>{const on=wiz.accept["g:"+g]??(g!=="其他");const proto=family(ids[0]).prefer.find(x=>ok.some(r=>r.k===x))||wiz.defaultProto;return`<div class="probe"><input type="checkbox" ${on?"checked":""} style="width:auto" onchange="wiz.accept['g:${g}']=this.checked"><span>${g}</span><span class="chip">${ids.length}</span><span class="hint">→ ${PNAME[proto]}${(()=>{const d=family(ids[0]).dialect;const eff=d==="openai"&&pr.category!=="official"?"generic":d;return eff!=="generic"?" · 方言 "+eff:"";})()}</span><span class="sp"></span><span class="hint">${ids.slice(0,3).join(", ")}${ids.length>3?" …":""}</span></div>`;}).join("")}</div>
    <div class="hint">采纳后所有值标为"自动"，可在详情页逐项修改或还原。</div><div class="foot"><button onclick="wiz.step=3;renderWizard()">上一步</button><button class="primary" onclick="wizAccept()">采纳并创建</button></div>`;}
}
function wizProbe(){const pr=PRESETS.find(x=>x.id===wiz.preset);const o=document.getElementById("w-origin");const k=document.getElementById("w-key");if(o)wiz.origin=o.value.trim();if(k)wiz.key=k.value;
  if(pr.input!=="key"&&!wiz.origin)return toast("请填写地址");if(pr.auth!=="none"&&!wiz.key)return toast("请填写 API Key");
  const origin=wiz.origin.replace(/\/v1(beta)?\/?$/,"");const keys=pr.probeAll||!Object.keys(pr.endpoints).length?PROTOCOLS:Object.keys(pr.endpoints);
  wiz.results=keys.map(k=>({k,url:((pr.endpoints[k]||{baseUrl:origin+(k==="google-generative-ai"?"/v1beta":k==="anthropic-messages"?"":"/v1")}).baseUrl).replace("{origin}",origin)+MODELS_PATH[k],status:"pending"}));wiz.step=3;renderWizard();
  wiz.results.forEach((r,i)=>setTimeout(()=>{r.status=pr.id==="custom"||pr.id==="new-api"?(r.k==="google-generative-ai"?"missing":"ok"):(pr.endpoints[r.k]&&pr.endpoints[r.k].note==="待探测"?"unknown":"ok");if(r.status==="ok")r.ms=150+Math.round(Math.random()*400);renderWizard();},400+i*350));}
function wizPool(){return {anthropic:["claude-sonnet-4","claude-opus-4"],openai:["gpt-5","gpt-5-mini","o4-mini"],gemini:["gemini-2.5-pro"],xai:["grok-4"],deepseek:["deepseek-v4-pro","deepseek-v4-flash","deepseek-chat"],zhipu:["glm-5","glm-5.2","glm-5.3"],minimax:["abab7-chat","minimax-m2"],moonshot:["kimi-k3","kimi-k2.7-code"],dashscope:["qwen3-max","qwen3-coder"],volcengine:["doubao-seed-2.0","doubao-pro-256k"],siliconflow:["deepseek-v4-flash","qwen3-235b","glm-5"],ollama:["llama3.1:8b","qwen3:32b"],lmstudio:["qwen3-32b"],openrouter:["anthropic/claude-sonnet-4","openai/gpt-5","deepseek/deepseek-v4-pro","qwen/qwen3-235b"],"new-api":["claude-sonnet-4","claude-opus-4","gpt-5","gpt-5-mini","deepseek-v4-pro","grok-4","glm-5","kimi-k3","qwen3-max","abab7-chat","hunyuan-t1","mistral-large"],local:["llama3.1:8b","qwen3:32b"],custom:["gpt-5","claude-sonnet-4","glm-5","my-finetune-01"]};}
function wizSummary(){const pr=PRESETS.find(x=>x.id===wiz.preset);const ok=wiz.results.filter(r=>r.status==="ok").map(r=>r.k);wiz.defaultProto=ok.includes(pr.defaultChatProtocol)?pr.defaultChatProtocol:ok[0];const pool=wizPool();wiz.models=pool[pr.id]||pool.custom;wiz.step=4;renderWizard();}
function wizAccept(){const pr=PRESETS.find(x=>x.id===wiz.preset);const origin=wiz.origin.replace(/\/v1(beta)?\/?$/,"");const id="p"+Date.now();const endpoints={};wiz.results.forEach(r=>{const url=r.url.replace(MODELS_PATH[r.k],"");endpoints[r.k]={enabled:r.status==="ok"&&wiz.accept[r.k]!==false,baseUrl:url,probe:{status:r.status,ms:r.ms},src:"auto",note:(pr.endpoints[r.k]||{}).note,quirks:(pr.endpoints[r.k]||{}).quirks};});
  const models=wiz.models.filter(mid=>wiz.accept["g:"+family(mid).key]??(family(mid).key!=="其他")).map(mid=>{const rule=(pr.models||[]).find(x=>x.match===mid);return m(mid.replace(/^[a-z]+\//,""),Object.assign({wireModelId:mid.includes("/")?mid:undefined},rule?{chatProtocols:rule.chatProtocols,src:"preset"}:{}));});
  const dup=providers.filter(x=>x.presetId===pr.id).length;const p=mk({id,name:pr.id==="custom"?(origin.replace(/^https?:\/\//,"")||"自定义供应商"):pr.name+(pr.input!=="key"?" · "+origin.replace(/^https?:\/\//,""):"")+(dup?" · "+(dup+1):""),presetId:pr.id,category:pr.category,enabled:true,credentials:[{id:"k1",label:"默认",key:wiz.key||"(无)",enabled:true,scope:{mode:"auto"},lastModels:models.map(x=>x.id)}],dialect:pr.dialect,defaultChatProtocol:wiz.defaultProto,endpoints,customHeaders:[],models});
  providers.push(p);sel=id;closeWizard();renderAll();toast("已创建，所有值标为自动，可逐项调整");}


// ───────────────── 对话框：添加渠道 ─────────────────
const REQ_PATH={"openai-completions":"/chat/completions","anthropic-messages":"/v1/messages","openai-responses":"/responses","google-generative-ai":"/models/{model}:generateContent"};
const PRIMARY_EPS=["openai-completions","anthropic-messages"],MORE_EPS=["openai-responses","google-generative-ai"];
let ac=null;
function openAddChannel(){ac={name:"",category:"relay",key:"",preset:"",eps:{},more:false,err:""};renderAddChannel();document.getElementById("overlay").classList.add("open");}
function closeAddChannel(){document.getElementById("overlay").classList.remove("open");ac=null;}
function acField(k){const v=ac.eps[k]||"";const prev=v?`<div class="pathprev">实际请求路径：<b>${v.replace(/\/+$/,"")}${REQ_PATH[k]}</b>${k==="anthropic-messages"&&/\/v1$/.test(v)?"（已含 /v1，将写为 …/v1/messages）":""}</div>`:`<div class="hint">填写 API 根地址后会显示实际请求路径</div>`;
  return`<div class="lab" style="font-size:13px;color:var(--text)">${PNAME[k]}</div><input class="mono" placeholder="Base URL：https://example.com${k==="google-generative-ai"?"/v1beta":"/v1"}" value="${v}" oninput="ac.eps['${k}']=this.value.trim();ac.err='';renderAddChannel(true)">${prev}`;}
function renderAddChannel(keepFocus){const m=document.getElementById("modal");const initial=(ac.name.trim()[0]||"P").toUpperCase();const active=document.activeElement;const focusIdx=active&&active.tagName==="INPUT"?[...m.querySelectorAll("input,select")].indexOf(active):-1;const caret=active&&active.selectionStart;
  m.innerHTML=`<h3>添加渠道</h3><div class="hint" style="margin:-4px 0 10px">自定义中转、聚合网关或尚未内置的厂商。填地址与 Key 后自动探测四类接口并拉取模型。</div>
  <div class="avatar">${initial}</div>
  <div style="display:flex;gap:6px;justify-content:center;margin:0 0 10px"><button class="sm">图片上传</button><button class="sm">内置头像</button><button class="sm">重置头像</button></div>
  <div class="row2"><div><div class="lab">渠道名称 <span class="req">*</span></div><input placeholder="例如 我的中转" value="${ac.name}" oninput="ac.name=this.value;ac.err='';renderAddChannel(true)"></div><div><div class="lab">类型</div><select onchange="ac.category=this.value"><option value="relay" ${ac.category==="relay"?"selected":""}>中转 / 聚合网关</option><option value="official" ${ac.category==="official"?"selected":""}>厂商官方</option><option value="self-hosted" ${ac.category==="self-hosted"?"selected":""}>自建 / 本地</option></select></div></div>
  <div class="lab">API 密钥</div><input class="mono" type="password" placeholder="输入 API 密钥；本地服务可留空" value="${ac.key}" oninput="ac.key=this.value">
  <div class="lab" style="margin-top:14px;font-size:13px;color:var(--text)">端点设置 <span class="hint">四类接口按需填写，留空的接口不创建</span></div>
  ${PRIMARY_EPS.map(acField).join("")}
  <details class="more" ${ac.more?"open":""} ontoggle="ac.more=this.open"><summary>更多设置（OpenAI Responses、Gemini）</summary>${MORE_EPS.map(acField).join("")}</details>
  <div class="lab" style="margin-top:14px;font-size:13px;color:var(--text)">从预设创建（可选）</div><div class="hint">适用于 Coding Plan 接入、多账号管理或项目隔离；选择后填入该渠道的接口与地址，Base URL 和 Key 仍可单独改。</div>
  <select onchange="acApplyPreset(this.value)"><option value="">从渠道预设创建…</option>${PRESETS.filter(x=>!x.hiddenInList).map(x=>`<option value="${x.id}" ${ac.preset===x.id?"selected":""}>${x.name}${x.native?"（原生）":""}</option>`).join("")}</select>
  ${ac.err?`<div class="hint" style="color:var(--bad);margin-top:8px">${ac.err}</div>`:""}
  <div class="foot"><button onclick="closeAddChannel()">取消</button><button class="primary" onclick="acSubmit()">添加并探测</button></div>`;
  if(keepFocus&&focusIdx>=0){const el=m.querySelectorAll("input,select")[focusIdx];if(el){el.focus();if(typeof caret==="number"&&el.setSelectionRange)try{el.setSelectionRange(caret,caret);}catch(e){}}}}
function acApplyPreset(id){ac.preset=id;const pr=PRESETS.find(x=>x.id===id);if(!pr)return renderAddChannel();const origin=pr.origin||"https://relay.example.com";ac.eps={};Object.keys(pr.endpoints).forEach(k=>ac.eps[k]=pr.endpoints[k].baseUrl.replace("{origin}",origin));ac.name=ac.name||pr.name+" · 新实例";ac.category=pr.category;ac.more=MORE_EPS.some(k=>ac.eps[k]);renderAddChannel();}
function acSubmit(){if(!ac.name.trim()){ac.err="请填写渠道名称";return renderAddChannel();}const filled=PROTOCOLS.filter(k=>ac.eps[k]);if(!filled.length){ac.err="至少填写一个接口的 Base URL";return renderAddChannel();}
  const pr=PRESETS.find(x=>x.id===ac.preset);const id="p"+Date.now();const endpoints={};filled.forEach(k=>{endpoints[k]={enabled:true,baseUrl:ac.eps[k],src:pr&&pr.endpoints[k]?"preset":"user",quirks:pr&&pr.endpoints[k]?pr.endpoints[k].quirks:undefined};});
  const def=(pr&&filled.includes(pr.defaultChatProtocol))?pr.defaultChatProtocol:["openai-completions","openai-responses","anthropic-messages","google-generative-ai"].find(k=>filled.includes(k));
  const p=mk({id,name:ac.name.trim(),presetId:pr?pr.id:"custom",category:ac.category,enabled:true,credentials:[{id:"k1",label:"默认",key:ac.key||"(无)",enabled:true,scope:{mode:"auto"}}],dialect:pr?pr.dialect:undefined,defaultChatProtocol:def,endpoints,customHeaders:[],models:[]});
  providers.push(p);sel=id;closeAddChannel();renderAll();toast("渠道已添加，开始探测接口并拉取模型…");
  setTimeout(()=>{filled.forEach(k=>{p.endpoints[k].probe=simProbe(p,k);});const pool=pr?(wizPool()[pr.id]||wizPool().custom):wizPool().custom;pool.forEach(mid=>{const rule=pr&&(pr.models||[]).find(x=>x.match===mid);p.models.push(m(mid.replace(/^[a-z]+\//,""),Object.assign({wireModelId:mid.includes("/")?mid:undefined},rule?{chatProtocols:rule.chatProtocols,src:"preset"}:{})));});p.activeModels=p.models.map(x=>x.id);p.credentials[0].lastModels=p.models.map(x=>x.id);renderAll();toast("探测完成：拉到 "+p.models.length+" 个模型，所有值标为自动");},900);}

function renderAll(){renderList();renderDetail();if(drawerState)renderDrawer();}
renderAll();
</script>
